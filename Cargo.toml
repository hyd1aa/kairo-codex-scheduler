[workspace]
members = ["crates/kairo-core", "crates/kairo-platform", "crates/kairo-cli"]
resolver = "2"
[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
anyhow = "1"
