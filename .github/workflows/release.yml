name: Release candidate (HTTPS and SHA256; never publishes)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    env:
      KAIRO_OFFLINE: '1'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file Cargo.lock
      - run: python3 scripts/check-secrets.py && python3 tests/git_secret_scan.py
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
  build:
    needs: security
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    env:
      LANG: C.UTF-8
      KAIRO_OFFLINE: '1'
      CARGO_BUILD_JOBS: '1'
    steps:
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential curl ca-certificates git pkg-config python3 python3-yaml tzdata
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
          toolchain: 1.99.1
      - name: Trust only this checked-out container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cargo fmt --check
      - run: cargo test -p kairo-cli --locked
      - run: cargo build --release --locked -p kairo-cli
      - run: python3 tests/online_cli.py target/release/kairo
      - run: python3 tests/panel_navigation.py target/release/kairo
      - run: python3 tests/workflow_policy.py
      - run: |
          mkdir dist
          cp target/release/kairo "dist/kairo-${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-${{ matrix.target }}
          path: dist/kairo-${{ matrix.target }}
  assemble:
    needs: build
    runs-on: ubuntu-24.04
    env:
      KAIRO_OFFLINE: '1'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - run: |
          cargo fetch --locked
          python3 scripts/package-online.py binaries/kairo-x86_64-unknown-linux-gnu binaries/kairo-aarch64-unknown-linux-gnu dist --source "$GITHUB_SHA"
          sudo apt-get update && sudo apt-get install -y python3-jsonschema
          curl -fLsS --max-time 60 https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json -o "$RUNNER_TEMP/spdx.schema.json"
          printf '%s  %s\n' 239208b7ac287b3cf5d9a9af23f9d69863971102a5e1587a27a398b43490b89b "$RUNNER_TEMP/spdx.schema.json" | sha256sum -c -
          python3 tests/validate_sbom.py dist/sbom.spdx.json "$RUNNER_TEMP/spdx.schema.json"
          python3 tests/package_contents.py dist/kairo-0.2.3.tar.gz
          python3 scripts/check-release-secrets.py dist
          (cd dist && sha256sum -c SHA256SUMS)
          docker build -f tests/Dockerfile.online -t kairo-online-test .
          python3 tests/online_install.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: dist/*
