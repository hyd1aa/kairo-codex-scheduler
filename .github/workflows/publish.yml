name: Prepare draft Release (explicit approval only)
on:
  workflow_dispatch:
    inputs:
      approved:
        type: boolean
        default: false
        required: true
      source:
        type: string
        required: true
      candidate_run:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  draft:
    if: inputs.approved && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Bind successful candidate to exact source and pre-existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          RUN: ${{ inputs.candidate_run }}
        run: |
          set -eu
          python3 -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}",os.environ["SOURCE"]); assert re.fullmatch("[0-9]+",os.environ["RUN"])'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" > run.json
          python3 -c 'import json,os; r=json.load(open("run.json")); assert r["conclusion"]=="success" and r["head_sha"]==os.environ["SOURCE"] and r["head_branch"]=="main" and r["path"]==".github/workflows/release.yml" and r["event"]=="workflow_dispatch"'
          git fetch origin refs/tags/v0.2.3:refs/tags/v0.2.3
          test "$(git rev-list -n1 v0.2.3)" = "$SOURCE"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name release-candidate --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          python3 scripts/check-release-secrets.py dist
          gh release create v0.2.3 --repo "$GITHUB_REPOSITORY" --draft --verify-tag --target "$SOURCE" --title 'Kairo v0.2.3' --notes-file docs/RELEASE_NOTES_0.2.3.md dist/*
